site_name: filterax
site_description: Differentiable ensemble Kalman filters, smoothers, and processes for JAX.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/filterax
repo_name: jejjohnson/filterax

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            preload_modules: [gaussx]
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            filters: ["!^_"]
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true

nav:
  - Home: index.md
  - API Reference:
      - Overview: api/index.md
      - Protocols & Types: api/protocols.md
      - Primitives: api/primitives.md
      - Localization: api/localization.md
      - Inflation: api/inflation.md
      - Filters: api/filters.md
      - Advanced filters: api/filters_advanced.md
      - Smoothers: api/smoothers.md
      - Processes: api/processes.md
      - Schedulers: api/schedulers.md
      - optax integration: api/optax.md
      - Differentiable training: api/differentiable.md
      - Diagnostics: api/diagnostics.md
      - pipekit integration: api/pipekit.md
  - Contributing: contributing.md
  - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
