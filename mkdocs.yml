# MkDocs builds only the API reference, from the docstrings, into site/.
# The prose half (maths reference, design docs) is a MyST site under
# docs/myst.yml; scripts/build_docs.py builds both and mounts this one at
# /reference/. See docs/README.md.
site_name: filterax API reference
site_description: API reference for filterax, generated from Google-style docstrings.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/filterax
repo_name: jejjohnson/filterax

docs_dir: docs/api
site_dir: site

# Links from the API pages into the prose are absolute URLs to the deployed
# MyST site, which MkDocs cannot see.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            preload_modules: [gaussx]
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            filters: ["!^_"]

nav:
  - Overview: index.md
  - Protocols & Types: protocols.md
  - Primitives: primitives.md
  - Localization: localization.md
  - Inflation: inflation.md
  - Filters: filters.md
  - Advanced filters: filters_advanced.md
  - Smoothers: smoothers.md
  - Processes: processes.md
  - Schedulers: schedulers.md
  - optax integration: optax.md
  - Differentiable training: differentiable.md
  - Diagnostics: diagnostics.md
  - pipekit integration: pipekit.md
  - Integrations: integrations.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
