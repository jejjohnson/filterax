site_name: filterax
site_description: Differentiable ensemble Kalman filters, smoothers, and processes for JAX.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/filterax
repo_name: jejjohnson/filterax

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            preload_modules: [gaussx]
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            filters: ["!^_"]
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true

nav:
  - Home: index.md
  - Mathematical Reference:
      - Foundation:
          - 1. Problem Setting: math/01_problem_setting.md
          - 2. Ensemble Representation: math/02_ensemble_representation.md
          - 3. Observation Model: math/03_observation_model.md
      - Analysis Methods:
          - 4. Kalman Update & Ensemble Gain: math/04_kalman_update.md
          - 5. Stochastic EnKF: math/05_stochastic_enkf.md
          - 6. ETKF: math/06_etkf.md
          - 7. EnSRF & ESTKF: math/07_ensrf_estkf.md
          - 8. LETKF: math/08_letkf.md
          - 9. Ensemble Kalman Processes: math/09_ensemble_kalman_processes.md
          - 10. Ensemble Smoothers: math/10_smoothers.md
      - Cross-cutting:
          - 11. Localization: math/11_localization.md
          - 12. Inflation: math/12_inflation.md
          - 13. Diagnostics & Likelihood: math/13_diagnostics.md
          - 14. Differentiable Assimilation: math/14_differentiable.md
          - 15. Latent-Space Ensemble DA: math/15_latent_da.md
          - 16. The Assimilation Cycle: math/16_assimilation_cycle.md
      - Reference:
          - Notation: math/notation.md
          - References: math/references.md
  - API Reference:
      - Overview: api/index.md
      - Protocols & Types: api/protocols.md
      - Primitives: api/primitives.md
      - Localization: api/localization.md
      - Inflation: api/inflation.md
      - Filters: api/filters.md
      - Advanced filters: api/filters_advanced.md
      - Smoothers: api/smoothers.md
      - Processes: api/processes.md
      - Schedulers: api/schedulers.md
      - optax integration: api/optax.md
      - Differentiable training: api/differentiable.md
      - Diagnostics: api/diagnostics.md
      - pipekit integration: api/pipekit.md
  - Contributing: contributing.md
  - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
