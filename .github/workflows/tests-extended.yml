name: Extended Tests

# The slow + integration tests the PR fast lane skips. Runs:
#   - weekly (Monday 05:17 UTC), full suite; a failure opens a `ci-failure` issue.
#   - on a PR labelled `run-slow`, heavy lane (slow + integration only),
#     re-running on every push while the label is on.
#   - on demand, from the Actions tab or:
#       gh workflow run tests-extended.yml                 # heavy lane (slow + integration)
#       gh workflow run tests-extended.yml -f suite=full   # entire suite

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which tests to run"
        type: choice
        default: heavy
        options:
          - heavy   # only slow + integration tests
          - full    # entire suite
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

# A new push supersedes a running PR run, so PR runs share a group per ref.
# Everything else gets a group of its own:
#   - concurrency applies before the job `if:`, so adding any other label
#     would cancel a real run for one that then skips;
#   - an `opened` event never runs (see the job `if:`), so it must not
#     cancel, or be cancelled by, the `labeled` run that follows it.
concurrency:
  group: >-
    tests-extended-${{
    (github.event_name == 'pull_request' &&
     github.event.action != 'opened' &&
     !(github.event.action == 'labeled' && github.event.label.name != 'run-slow'))
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-extended:
    # On PRs, only with the `run-slow` label; for a `labeled` event, only
    # when that label is the one just added. A PR opened with the label also
    # gets a `labeled` event, so the `opened` event skips; otherwise the two
    # runs share a group and one shows up as cancelled.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-slow') &&
       github.event.action != 'opened' &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-slow'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Dispatch picks the suite; scheduled runs take the full suite and
      # labelled PRs the heavy lane.
      SUITE: ${{ inputs.suite || (github.event_name == 'schedule' && 'full') || 'heavy' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run heavy lane (slow + integration)
        if: env.SUITE == 'heavy'
        run: uv run pytest -v -m "slow or integration"
      - name: Run full suite
        if: env.SUITE == 'full'
        run: uv run pytest -v

  report:
    needs: test-extended
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/report-scheduled-failure
        with:
          title: "ci: the weekly extended-tests run failed"
